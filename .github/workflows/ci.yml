# Advanced CI Workflow (GitHub Flow 嚴謹版)
# 適合團隊 / 生產專案：PR gate + path filter + concurrency + CI→E2E workflow_run 鏈
name: CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'server/**'
      - 'shared/**'
      - 'layers/**'
      - 'build/**'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/check-ci-gate.mjs'
      - 'scripts/check-deploy-health.mjs'
      - 'scripts/render-staging-wrangler.mjs'
      - 'server/database/migrations/**'
      - 'test/unit/ci-gate.test.ts'
      - 'test/unit/deploy-health-check.test.ts'
      - 'test/integration/migration-stack-fresh-db.spec.ts'
      - 'r2-cors.json'
      - 'wrangler.staging.jsonc'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  # 刻意不加 paths filter：deploy.yml 的 verify-ci-gate 要求每個 main SHA
  # 必須有對應成功的 CI run，加回 paths 會讓 docs/openspec-only commit 撐爆 gate。
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format / Lint / Typecheck / Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # evlog map gate 要跟 base ref 比對，才判斷得出「本次 diff 觸及哪些
          # entry point」。shallow clone 會讓那條判定退化成 warning。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        env:
          BETTER_AUTH_SECRET: test-better-auth-secret-at-least-32-chars
          NUXT_SESSION_PASSWORD: test-session-password-at-least-32-chars
        run: pnpm test

      - name: evlog map coverage gate
        uses: ./.github/actions/evlog-map-gate
        with:
          base-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          # mode 必須明寫。這個 repo 的 gate 是 ratchet：committed 的
          # evlog.map.json（score 56）是不可倒退的地板，本次 diff 觸及的
          # entry point 必須滿分。省略 mode 會繼承 action 的預設值，而那個
          # 預設值會隨上游改動而變 —— 這裡就發生過一次（clade 448a4412d
          # 於 2026-08-02 把預設從 ratchet 翻成 strict），56 分的 repo 因此
          # 自 2026-07-31 起 CI 全紅、staging 一次都沒部署過。
          # 爬到 100 分之前，模式由本檔宣告，不由預設值決定。見 TD-073。
          mode: ratchet
